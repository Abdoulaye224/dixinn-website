# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name dixinn.com www.dixinn.com;
    return 301 https://dixinn.com$request_uri;
}

# Redirection www → non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.dixinn.com;

    ssl_certificate /etc/letsencrypt/live/dixinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dixinn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dixinn.com$request_uri;
}

# Site principal
server {
    listen 443 ssl;
    server_name dixinn.com;

    ssl_certificate /etc/letsencrypt/live/dixinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dixinn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dixinn.com;
    index index.html;

    # SPA routing — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets buildés (Vite génère des noms uniques)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
